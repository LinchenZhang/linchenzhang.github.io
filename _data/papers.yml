    papers:
      - title: Recognizing Dominance through Local Improvement
        url: /files/Local_Improvement_Linchen_Zhang.pdf
        version: November 2026
        abstract: >-
          Participants in strategy-proof mechanisms often fail to play their dominant strategies. Most existing
          simplicity concepts attribute these failures to the cost of contingent reasoning and lower the cost by
          comparing the worst case of the dominant strategy with the best case of an alternative. I argue that a
          participant can instead compare a strategy with its neighbors, such as the bids one step above and below,
          and move to a better neighbor until none remains. I formalize this idea with a neighbor relation on each
          strategy set and call a mechanism local improvement solvable if every such sequence of moves ends at a
          dominant strategy. Strategy-proofness is the criterion under the complete neighbor relation. Under their
          natural neighbor relations, the criterion holds in the sealed-bid second-price auction, the multi-unit
          Vickrey auction, and, in rich environments, serial dictatorship, top trading cycles, and deferred
          acceptance. In extensive-form mechanisms without duplicate dominant strategies, the criterion under
          one-situation neighbors is strict action-proofness, which yields a one-shot deviation principle for
          dominance. This criterion and obvious strategy-proofness classify the pick-a-number game, chess, and Sudoku
          in opposite ways. Among local improvement solvable mechanisms that implement the same outcomes, the model
          predicts more dominant-strategy play when the local comparison is salient.
        seminars:
          - UC San Diego TBE Seminar
          - UC San Diego TBE Workshop

  - id: working-papers
    title: Working Papers
    papers:
      - title: Coarse Revenue Guarantee in First Price Auction and Beyond
        url: /files/CRG%20in%20FPA_Linchen_Zhang.pdf
        version: October 2026
        abstract: >-
          I study the coarse revenue guarantee (CRG) of the single-unit first-price auction with common values. The
          CRG is the minimum expected revenue over all information structures and all Bayes coarse correlated
          equilibria (BCCE), the equilibrium notion to which no-regret learning leads. Identical play, in which all
          bidders submit the same bid, attains the worst-case revenue, and this reduction yields a closed-form
          characterization. The coarse guarantee is positive and increases with the number of bidders $N$. It lies
          strictly below the revenue guarantee of Bergemann, Brooks and Morris (2017) at every finite $N$, and the gap
          between the two closes at rate $\log N/N$. I extend the analysis to reserve prices, symmetric and asymmetric
          priors, other standard auctions, and an unknown value distribution.
        seminars:
          - UC San Diego TBE Workshop
        conferences:
          - GAIMSS 2024 (flash talk and poster)
          - ACM EC 2024 (poster)
          - Stony Brook Game Theory Conference 2024
          - Caltech Student Theory Conference 2025
          - Southwest Economics Theory Conference 2026
          - Econometric Society Asian-China Meeting 2026

      - title: Market Order Mechanisms
        url: /files/bdz_market.pdf
        coauthors:
          - name: Benjamin Brooks
            url: https://www.benjaminbrooks.net/
          - name: Songzi Du
            url: https://econweb.ucsd.edu/~sodu/
        version: May 2026
        abstract: >-
          A homogeneous good is for sale to a large number of buyers with multi-unit demand. There are
          both common and idiosyncratic components to preferences. Trade occurs via a market order
          mechanism: Each buyer places an order for a number of units; the orders are filled in a random
          sequence; and buyers pay a price per unit that is a function of the aggregate order. We study
          the limit of such economies as the numbers of buyers and units grows large. If the pricing rules
          have vanishing price impact and span, then regardless of the sequence of information structures
          and equilibria, the limiting market outcome is guaranteed to be competitive: The goods are sold
          to the buyers with the highest values, at an expected price that is equal to the expected
          marginal value for the good. It is impossible to achieve similar guarantees for information
          aggregation.
        conferences:
          - Stony Brook Game Theory Conference 2025
          - 2026 Asian School in Theory
        coauthor_seminars:
