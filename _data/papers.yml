sections:
  - id: job-market-paper
    title: Job Market Paper
    featured: true
    papers:
      - title: Recognizing Dominance through Local Improvement
        status: Draft available upon request
        abstract: >-
          Strategy-proofness is the traditional standard of simplicity in mechanism design, yet participants often
          fail to play the dominant strategy. Existing simplicity concepts attribute this to contingent reasoning and
          ignore the structure of the strategy set, which I formalize as a neighbor relation. A mechanism is local
          improvement solvable if, from any starting strategy, repeatedly moving to an improving neighbor leads to a
          dominant strategy. Strategy-proofness is the coarsest case, and classical mechanisms satisfy the criterion
          under finer relations. The criterion offers a second angle on simplicity, distinct from obvious
          strategy-proofness. In extensive-form mechanisms and games without duplicate dominant strategies, it is
          strict action-proofness. Among mechanisms implementing the same outcomes, it predicts more dominant-strategy
          play where the local comparison is salient.

  - id: working-papers
    title: Working Papers
    papers:
      - title: Coarse Revenue Guarantee in First Price Auction and Beyond
        url: /files/CRG%20in%20FPA_Linchen_Zhang.pdf
        version: October 2026
        abstract: >-
          I study the coarse revenue guarantee (CRG) of the single-unit first-price auction with common values. The
          CRG is the minimum expected revenue over all information structures and all Bayes coarse correlated
          equilibria (BCCE), the equilibrium notion to which no-regret learning leads. The worst case is identical
          play, in which all bidders submit the same bid, and this reduction yields a closed-form characterization.
          The coarse guarantee is positive and increases with the number of bidders $N$. It lies strictly below the
          interim guarantee of Bergemann, Brooks and Morris (2017) at every finite $N$, and the gap between the two
          closes at rate $\log N/N$. I extend the analysis to reserve prices, symmetric and asymmetric priors, other
          standard auctions, and an unknown value distribution.
        presentations:
          - UCSD TBE Workshop
          - GAIMSS 2024 (flash talk and poster)
          - ACM EC 2024 (poster)
          - Stony Brook Game Theory Conference 2024
          - Caltech Student Theory Conference 2025
          - Southwest Economics Theory Conference 2026
          - Econometric Society Asian-China Meeting 2026

      - title: Market Order Mechanisms
        url: /files/bdz_market.pdf
        coauthors:
          - name: Benjamin Brooks
            url: https://www.benjaminbrooks.net/
          - name: Songzi Du
            url: https://econweb.ucsd.edu/~sodu/
        version: May 2026
        abstract: >-
          A homogeneous good is for sale to a large number of buyers with multi-unit demand. There are
          both common and idiosyncratic components to preferences. Trade occurs via a market order
          mechanism: Each buyer places an order for a number of units; the orders are filled in a random
          sequence; and buyers pay a price per unit that is a function of the aggregate order. We study
          the limit of such economies as the numbers of buyers and units grows large. If the pricing rules
          have vanishing price impact and span, then regardless of the sequence of information structures
          and equilibria, the limiting market outcome is guaranteed to be competitive: The goods are sold
          to the buyers with the highest values, at an expected price that is equal to the expected
          marginal value for the good. It is impossible to achieve similar guarantees for information
          aggregation.
        presentations:
          - Stony Brook Game Theory Conference 2025
          - 2026 Asian School in Theory
        coauthor_presentations:
