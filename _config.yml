# Site-wide settings. This file is *NOT* reloaded automatically when you use
# `jekyll serve`; restart the server after changing it.

# Basic Site Settings
locale                   : "en-US"
title                    : "Linchen Zhang"
title_separator          : "-"
name                     : "Linchen Zhang"
description              : "Personal website of Linchen Zhang, Economics Ph.D. candidate at UC San Diego working on microeconomic theory and mechanism design."
url                      : https://linchenzhang.github.io
baseurl                  : ""
repository               : "linchenzhang.github.io"

# Site Author - shown in the header of the home page (_layouts/home.html).
# Leave a field blank to hide its button.
author:
  avatar           : "linchen_pic.jpg"
  name             : "Linchen Zhang"
  name_native      : "张林辰"
  bio              : "Ph.D. Candidate in Economics, UC San Diego"
  location         : "San Diego, CA"
  employer         : "UC San Diego"
  email            : "liz032@ucsd.edu"
  cv               : "/files/Linchen_Zhang_CV.pdf"
  googlescholar    : # full URL, e.g. "https://scholar.google.com/citations?user=XXXX"
  ssrn             : # full URL of your SSRN author page
  orcid            : # full URL, e.g. "https://orcid.org/0000-0000-0000-0000"
  linkedin         : # username, e.g. "linchen-zhang"
  github           : # username


# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
comments:
  provider               : false
atom_feed:
  hide                   : true


# SEO Related
google_site_verification :
bing_site_verification   :
yandex_site_verification :


# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "linchen_pic.jpg" # image in /images/ used for link previews
social:
  type                   : Person
  name                   :
  links:


# Analytics
analytics:
  provider               : false # false (default), "google-analytics-4", "custom"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
